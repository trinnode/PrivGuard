{% extends "base.html" %}

{% block title %}Session Expired{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="card" style="text-align:center;">
    <div class="auth-header">
      <h1 class="logo-text">PrivGuard</h1>

  </div>
</div>
{% endblock %}
